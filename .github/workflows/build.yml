name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            pkg-config \
            libssl-dev \
            libsqlite3-dev \
            qt6-base-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Check binaries
        run: |
          ls -lah build/bin/
          file build/bin/server
          file build/bin/client

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: relay-linux
          path: build/bin/

  windows:
    name: Windows Build
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup vcpkg binary cache
        shell: pwsh
        run: |
          $cache = "$env:RUNNER_TEMP\vcpkg\archives"

          New-Item -ItemType Directory -Force -Path $cache | Out-Null

          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg\archives
          key: vcpkg-windows-x64-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            vcpkg-windows-x64-

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            pthreads:x64-windows `
            openssl:x64-windows `
            sqlite3:x64-windows `
            qtbase:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel

      - name: Check binaries
        shell: pwsh
        run: |
          Get-ChildItem build/bin/Release/

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: relay-windows
          path: build/bin/Release/